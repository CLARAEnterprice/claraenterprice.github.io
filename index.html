<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLARA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0ff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Particelle di sfondo */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(138, 43, 226, 0.6);
      border-radius: 50%;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-80px) scale(1.5); opacity: 1; }
    }

    /* Griglia di sfondo */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(138, 43, 226, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(138, 43, 226, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    /* Contenuto principale */
    .container {
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .title {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      background: linear-gradient(135deg, #a855f7, #6366f1, #ec4899, #a855f7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradient-shift 4s ease infinite;
      text-shadow: 0 0 80px rgba(168, 85, 247, 0.3);
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Linea animata sotto il titolo */
    .line {
      width: 0;
      height: 2px;
      margin: 2rem auto;
      background: linear-gradient(90deg, transparent, #a855f7, #ec4899, transparent);
      animation: expand 2s ease forwards 0.5s;
    }

    @keyframes expand {
      to { width: 80%; }
    }

    /* Effetto glow pulsante */
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: glow-pulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* Bottone */
    .btn {
      margin-top: 2rem;
      padding: 0.8rem 2.5rem;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e0e0ff;
      background: transparent;
      border: 1px solid rgba(168, 85, 247, 0.5);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.3));
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: inherit;
    }

    .btn:hover::before { opacity: 1; }

    .btn:hover {
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
      transform: translateY(-2px);
    }

    /* Cursor glow */
    .cursor-glow {
      position: fixed;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="particles" id="particles"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <div class="container">
    <div class="glow" style="top:-100px;left:50%;transform:translateX(-50%)"></div>
    <h1 class="title">CLARA</h1>
    <p class="subtitle">Luce nell'oscurità</p>
    <div class="line"></div>
    <button class="btn">Scopri</button>
  </div>

  <script>
    // Genera particelle
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 6 + 's';
      p.style.animationDuration = (4 + Math.random() * 4) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
      particlesEl.appendChild(p);
    }

    // Glow che segue il mouse
    const glow = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', e => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });
  </script>
</body>
</html>
