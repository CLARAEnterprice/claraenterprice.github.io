<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLARA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0ff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(138, 43, 226, 0.6);
      border-radius: 50%;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-80px) scale(1.5); opacity: 1; }
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(138, 43, 226, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(138, 43, 226, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    .container {
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .title {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      background: linear-gradient(135deg, #a855f7, #6366f1, #ec4899, #a855f7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradient-shift 4s ease infinite;
      text-shadow: 0 0 80px rgba(168, 85, 247, 0.3);
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .line {
      width: 0;
      height: 2px;
      margin: 2rem auto;
      background: linear-gradient(90deg, transparent, #a855f7, #ec4899, transparent);
      animation: expand 2s ease forwards 0.5s;
    }

    @keyframes expand {
      to { width: 80%; }
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: glow-pulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .btn {
      margin-top: 2rem;
      padding: 0.8rem 2.5rem;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e0e0ff;
      background: transparent;
      border: 1px solid rgba(168, 85, 247, 0.5);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.3));
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: inherit;
    }

    .btn:hover::before { opacity: 1; }

    .btn:hover {
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
      transform: translateY(-2px);
    }

    /* ===== PULSANTE PAPERELLA ===== */
    .btn-duck {
      border-color: rgba(250, 204, 21, 0.5);
      color: #fde68a;
    }

    .btn-duck::before {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.3), rgba(245, 158, 11, 0.3));
    }

    .btn-duck:hover {
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
    }

    .btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ===== PAPERELLA ===== */
    .duck {
      position: fixed;
      left: 50%;
      bottom: -200px;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease, bottom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .duck.show {
      bottom: 40px;
      opacity: 1;
      animation: duck-float 3s ease-in-out infinite;
    }

    @keyframes duck-float {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(-3deg); }
      50% { transform: translateX(-50%) translateY(-20px) rotate(3deg); }
    }

    .duck-body {
      position: relative;
      width: 120px;
      height: 120px;
    }

    /* Corpo */
    .duck-body::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10px;
      width: 100px;
      height: 70px;
      background: linear-gradient(135deg, #fde047, #f59e0b);
      border-radius: 50% 50% 45% 45%;
      box-shadow: inset -8px -8px 0 rgba(0,0,0,0.08);
    }

    /* Testa */
    .duck-head {
      position: absolute;
      top: 5px;
      left: 55px;
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, #fde047, #facc15);
      border-radius: 50%;
      box-shadow: inset -5px -5px 0 rgba(0,0,0,0.06);
      z-index: 2;
    }

    /* Becco */
    .duck-beak {
      position: absolute;
      top: 28px;
      left: 98px;
      width: 32px;
      height: 16px;
      background: linear-gradient(135deg, #fb923c, #ea580c);
      border-radius: 4px 12px 12px 4px;
      z-index: 3;
    }

    /* Occhio */
    .duck-eye {
      position: absolute;
      top: 18px;
      left: 82px;
      width: 8px;
      height: 8px;
      background: #1a1a1a;
      border-radius: 50%;
      z-index: 4;
      animation: blink 4s infinite;
    }

    .duck-eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    /* Ala */
    .duck-wing {
      position: absolute;
      bottom: 20px;
      left: 18px;
      width: 45px;
      height: 35px;
      background: linear-gradient(135deg, #facc15, #eab308);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      z-index: 3;
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.06);
      animation: wing-flap 1.5s ease-in-out infinite;
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-12deg); }
    }

    /* Zampette */
    .duck-feet {
      position: absolute;
      bottom: -8px;
      left: 30px;
      width: 20px;
      height: 10px;
      background: #fb923c;
      border-radius: 0 0 50% 50%;
      z-index: 1;
    }

    .duck-feet::after {
      content: '';
      position: absolute;
      left: 40px;
      width: 20px;
      height: 10px;
      background: #fb923c;
      border-radius: 0 0 50% 50%;
    }

    /* Bollicine */
    .duck-bubble {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(168, 85, 247, 0.6);
      border-radius: 50%;
      top: 20px;
      left: 100px;
      animation: bubble-rise 3s ease-in infinite;
    }

    .duck-bubble:nth-child(2) {
      left: 115px;
      width: 7px;
      height: 7px;
      animation-delay: 1s;
    }

    .duck-bubble:nth-child(3) {
      left: 95px;
      width: 5px;
      height: 5px;
      animation-delay: 2s;
    }

    @keyframes bubble-rise {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
    }

    .cursor-glow {
      position: fixed;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 0;
      transition: opacity 0.3s;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #12121a;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s ease;
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.15);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal .iban {
      background: rgba(168, 85, 247, 0.08);
      border: 1px dashed rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #c4b5fd;
      margin-bottom: 1.5rem;
      word-break: break-all;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal .iban:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.7);
    }

    .modal .iban-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.5rem;
    }

    .modal .msg {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }

    .modal .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal .close-btn:hover {
      color: #ec4899;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="particles" id="particles"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <div class="container">
    <div class="glow" style="top:-100px;left:50%;transform:translateX(-50%)"></div>
    <h1 class="title">CLARA</h1>
    <p class="subtitle">Ciao Nicole, questo dominio è costato 4,87 €</p>
    <div class="line"></div>
    <div class="btn-row">
      <button class="btn" id="openModal">Scopri</button>
      <button class="btn btn-duck" id="duckBtn">Paperella</button>
    </div>
  </div>

  <!-- Paperella fluttuante -->
  <div class="duck" id="duck">
    <div class="duck-body">
      <div class="duck-feet"></div>
      <div class="duck-wing"></div>
      <div class="duck-head"></div>
      <div class="duck-beak"></div>
      <div class="duck-eye"></div>
      <div class="duck-bubble"></div>
      <div class="duck-bubble"></div>
      <div class="duck-bubble"></div>
    </div>
  </div>

  <!-- Popup -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="close-btn" id="closeModal">&times;</button>
      <h2>Fai un regalo a Matteo e Franz</h2>
      <p class="iban-label">IBAN</p>
      <div class="iban" id="ibanField" title="Clicca per copiare">IT60X0542811101000000123456</div>
      <p class="msg">Si scherza (NON è un vero IBAN), siamo gentiluomini!</p>
    </div>
  </div>

  <script>
    // Particelle
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 6 + 's';
      p.style.animationDuration = (4 + Math.random() * 4) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
      particlesEl.appendChild(p);
    }

    // Cursor glow
    const glow = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', e => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });

    // Modal
    const overlay = document.getElementById('modalOverlay');
    const openBtn = document.getElementById('openModal');
    const closeBtn = document.getElementById('closeModal');

    openBtn.addEventListener('click', () => overlay.classList.add('active'));
    closeBtn.addEventListener('click', () => overlay.classList.remove('active'));
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('active');
    });

    // Copia IBAN al click
    document.getElementById('ibanField').addEventListener('click', function() {
      navigator.clipboard.writeText(this.textContent.trim());
      this.style.borderColor = '#10b981';
      setTimeout(() => this.style.borderColor = '', 1000);
    });

    // ===== PAPERELLA =====
    const duck = document.getElementById('duck');
    const duckBtn = document.getElementById('duckBtn');
    let duckVisible = false;

    duckBtn.addEventListener('click', () => {
      duckVisible = !duckVisible;
      if (duckVisible) {
        duck.classList.add('show');
        duckBtn.textContent = 'Nascondi';
      } else {
        duck.classList.remove('show');
        duckBtn.textContent = 'Paperella';
      }
    });
  </script>
</body>
</html>
